name: Deploy Backend to AWS ECS

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed

  workflow_dispatch:

concurrency:
  group: production-backend-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "010724906865"

  ECR_REPOSITORY: ally-backend

  ECS_CLUSTER: ally-backend-cluster
  ECS_SERVICE: ally-backend-service
  CONTAINER_NAME: Main

  # Runtime ECS service keeps using its existing DATABASE_URL / ally_app role.
  # Database migrations use a separate one-off task definition with the
  # privileged schema-owner DATABASE_URL.
  MIGRATION_TASK_FAMILY: ally_backend_migration_task
  MIGRATION_DATABASE_URL_SECRET: "arn:aws:secretsmanager:ap-south-1:010724906865:secret:ally/backend/migration-Gy2dvu:DATABASE_URL::"

  SUBNETS: subnet-0e59e6f2a84ecf3a3,subnet-0f5a3c7d49c374b61
  SECURITY_GROUP: sg-083db4ef98455c731

jobs:
  deploy:
    name: Safe Backend Deployment

    # Automatic deployment is allowed ONLY when:
    # 1. Backend CI succeeded
    # 2. CI was triggered by a push
    # 3. The push was to main
    #
    # Manual production deployment is also restricted to main.
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. CHECKOUT EXACT COMMIT THAT PASSED CI
      # ---------------------------------------------------------

      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set deployment SHA
        id: deploy-sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            DEPLOY_SHA="${{ github.sha }}"
          fi

          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $DEPLOY_SHA"

      # ---------------------------------------------------------
      # 2. AWS AUTHENTICATION
      # ---------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::010724906865:role/ally-github-deploy
          aws-region: ap-south-1

      # ---------------------------------------------------------
      # 3. CAPTURE CURRENT PRODUCTION TASK
      #
      # This exact production task definition becomes:
      # - the template for the new runtime task
      # - the rollback target if deployment fails
      #
      # This preserves:
      # - runtime DATABASE_URL (ally_app)
      # - Gotenberg sidecar
      # - ports
      # - existing secrets
      # - environment variables
      # - task/execution roles
      # - logging configuration
      # ---------------------------------------------------------

      - name: Capture current production task definition
        id: previous-task
        run: |
          CURRENT_TASK_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ -z "$CURRENT_TASK_ARN" ] || [ "$CURRENT_TASK_ARN" = "None" ]; then
            echo "Could not determine current production task definition."
            exit 1
          fi

          echo "arn=$CURRENT_TASK_ARN" >> "$GITHUB_OUTPUT"

          echo "============================================"
          echo "CURRENT PRODUCTION TASK"
          echo "$CURRENT_TASK_ARN"
          echo "============================================"

      # ---------------------------------------------------------
      # 4. LOGIN TO ECR
      # ---------------------------------------------------------

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin \
                "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # ---------------------------------------------------------
      # 5. BUILD + PUSH EXACT TESTED COMMIT
      # ---------------------------------------------------------

      - name: Build and push Docker image
        id: image
        working-directory: backend
        run: |
          DEPLOY_SHA="${{ steps.deploy-sha.outputs.sha }}"

          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$DEPLOY_SHA"

          echo "Building: $IMAGE_URI"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 6. CREATE NEW RUNTIME TASK DEFINITION
      #
      # This is the task definition that will eventually be
      # deployed to ally-backend-service.
      #
      # IMPORTANT:
      # Only the Main container image is changed.
      #
      # DATABASE_URL remains the existing production runtime
      # secret, which connects as ally_app.
      # ---------------------------------------------------------

      - name: Create new runtime ECS task definition
        id: runtime-taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.previous-task.outputs.arn }}" \
            --query taskDefinition \
            > current-taskdef.json

          jq \
            --arg IMAGE "${{ steps.image.outputs.uri }}" \
            --arg CONTAINER "$CONTAINER_NAME" \
            '
            .containerDefinitions |= map(
              if .name == $CONTAINER
              then .image = $IMAGE
              else .
              end
            )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            ' \
            current-taskdef.json > runtime-taskdef.json

          RUNTIME_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://runtime-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          if [ -z "$RUNTIME_TASK_ARN" ] || [ "$RUNTIME_TASK_ARN" = "None" ]; then
            echo "Could not register runtime ECS task definition."
            exit 1
          fi

          echo "arn=$RUNTIME_TASK_ARN" >> "$GITHUB_OUTPUT"

          echo "============================================"
          echo "NEW RUNTIME TASK DEFINITION"
          echo "$RUNTIME_TASK_ARN"
          echo "============================================"

      # ---------------------------------------------------------
      # 7. CREATE SEPARATE MIGRATION TASK DEFINITION
      #
      # This task definition is NEVER deployed to the ECS service.
      #
      # It clones the new runtime task, but:
      # - uses a separate family
      # - replaces ONLY Main -> DATABASE_URL
      # - points DATABASE_URL at the privileged migration secret
      #
      # Runtime production tasks therefore continue using ally_app.
      # ---------------------------------------------------------

      - name: Create migration-only ECS task definition
        id: migration-taskdef
        run: |
          jq \
            --arg FAMILY "$MIGRATION_TASK_FAMILY" \
            --arg CONTAINER "$CONTAINER_NAME" \
            --arg DB_SECRET "$MIGRATION_DATABASE_URL_SECRET" \
            '
            .family = $FAMILY
            |
            .containerDefinitions |= map(
              if .name == $CONTAINER then
                .secrets = (
                  (.secrets // [])
                  | map(
                      if .name == "DATABASE_URL"
                      then .valueFrom = $DB_SECRET
                      else .
                      end
                    )
                )
              else .
              end
            )
            ' \
            runtime-taskdef.json > migration-taskdef.json

          MAIN_CONTAINER_COUNT=$(jq \
            --arg CONTAINER "$CONTAINER_NAME" \
            '[.containerDefinitions[] | select(.name == $CONTAINER)] | length' \
            migration-taskdef.json)

          DATABASE_SECRET_COUNT=$(jq \
            --arg CONTAINER "$CONTAINER_NAME" \
            '[
              .containerDefinitions[]
              | select(.name == $CONTAINER)
              | (.secrets // [])[]
              | select(.name == "DATABASE_URL")
            ] | length' \
            migration-taskdef.json)

          DATABASE_SECRET_VALUE=$(jq -r \
            --arg CONTAINER "$CONTAINER_NAME" \
            '
            .containerDefinitions[]
            | select(.name == $CONTAINER)
            | (.secrets // [])[]
            | select(.name == "DATABASE_URL")
            | .valueFrom
            ' \
            migration-taskdef.json)

          if [ "$MAIN_CONTAINER_COUNT" != "1" ]; then
            echo "Expected exactly one Main container."
            echo "Found: $MAIN_CONTAINER_COUNT"
            exit 1
          fi

          if [ "$DATABASE_SECRET_COUNT" != "1" ]; then
            echo "Expected exactly one DATABASE_URL secret on Main."
            echo "Found: $DATABASE_SECRET_COUNT"
            exit 1
          fi

          if [ "$DATABASE_SECRET_VALUE" != "$MIGRATION_DATABASE_URL_SECRET" ]; then
            echo "Migration DATABASE_URL secret replacement failed."
            exit 1
          fi

          MIGRATION_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://migration-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          if [ -z "$MIGRATION_TASK_ARN" ] || [ "$MIGRATION_TASK_ARN" = "None" ]; then
            echo "Could not register migration ECS task definition."
            exit 1
          fi

          echo "arn=$MIGRATION_TASK_ARN" >> "$GITHUB_OUTPUT"

          echo "============================================"
          echo "MIGRATION-ONLY TASK DEFINITION"
          echo "$MIGRATION_TASK_ARN"
          echo "============================================"

      # ---------------------------------------------------------
      # 8. MIGRATION DATABASE PREFLIGHT
      #
      # Uses the migration-only task definition and therefore the
      # privileged schema-owner DATABASE_URL.
      # ---------------------------------------------------------

      - name: Check migration task against production DB
        id: migration-preflight
        run: |
          RESULT=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "${{ steps.migration-taskdef.outputs.arn }}" \
            --network-configuration \
            "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --overrides \
            "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"alembic\",\"current\"]}]}")

          echo "$RESULT"

          TASK_ARN=$(echo "$RESULT" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$TASK_ARN" ]; then
            echo "Could not start migration preflight task."
            echo "$RESULT" | jq '.failures'
            exit 1
          fi

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for migration DB preflight
        run: |
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "${{ steps.migration-preflight.outputs.task_arn }}"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "${{ steps.migration-preflight.outputs.task_arn }}" \
            --query "tasks[0].containers[?name=='$CONTAINER_NAME'].exitCode | [0]" \
            --output text)

          echo "Migration DB preflight exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task cannot safely connect to the production DB."

            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "${{ steps.migration-preflight.outputs.task_arn }}" \
              --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[*].{name:name,reason:reason,exitCode:exitCode}}'

            echo "DEPLOYMENT STOPPED."
            exit 1
          fi

          echo "Migration DB preflight passed."

      # ---------------------------------------------------------
      # 9. RUN ALEMBIC MIGRATION EXACTLY ONCE
      #
      # IMPORTANT:
      # This uses the privileged migration-only task definition.
      #
      # The ECS production service has NOT been changed yet.
      # ---------------------------------------------------------

      - name: Run Alembic migration once
        id: migrate
        run: |
          RESULT=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "${{ steps.migration-taskdef.outputs.arn }}" \
            --network-configuration \
            "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --overrides \
            "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}")

          echo "$RESULT"

          TASK_ARN=$(echo "$RESULT" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$TASK_ARN" ]; then
            echo "Could not start migration task."
            echo "$RESULT" | jq '.failures'
            exit 1
          fi

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for migration
        run: |
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "${{ steps.migrate.outputs.task_arn }}"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "${{ steps.migrate.outputs.task_arn }}" \
            --query "tasks[0].containers[?name=='$CONTAINER_NAME'].exitCode | [0]" \
            --output text)

          echo "Migration exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "DATABASE MIGRATION FAILED."

            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "${{ steps.migrate.outputs.task_arn }}" \
              --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[*].{name:name,reason:reason,exitCode:exitCode}}'

            echo "ECS service will NOT be updated."
            exit 1
          fi

          echo "Database migration successful."

      # ---------------------------------------------------------
      # 10. VERIFY RUNTIME ROLE AFTER MIGRATION
      #
      # The migration has now completed, but the production service
      # still has NOT been updated.
      #
      # Run the new runtime task definition using its normal
      # ally_app DATABASE_URL to confirm that the runtime role can
      # still connect to the migrated database.
      # ---------------------------------------------------------

      - name: Check runtime task against migrated production DB
        id: runtime-preflight
        run: |
          RESULT=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "${{ steps.runtime-taskdef.outputs.arn }}" \
            --network-configuration \
            "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --overrides \
            "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"alembic\",\"current\"]}]}")

          echo "$RESULT"

          TASK_ARN=$(echo "$RESULT" | jq -r '.tasks[0].taskArn // empty')

          if [ -z "$TASK_ARN" ]; then
            echo "Could not start runtime DB compatibility task."
            echo "$RESULT" | jq '.failures'
            exit 1
          fi

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for runtime DB compatibility check
        run: |
          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "${{ steps.runtime-preflight.outputs.task_arn }}"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "${{ steps.runtime-preflight.outputs.task_arn }}" \
            --query "tasks[0].containers[?name=='$CONTAINER_NAME'].exitCode | [0]" \
            --output text)

          echo "Runtime DB compatibility exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Runtime ally_app task cannot connect after migration."

            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "${{ steps.runtime-preflight.outputs.task_arn }}" \
              --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[*].{name:name,reason:reason,exitCode:exitCode}}'

            echo "ECS service will NOT be updated."
            exit 1
          fi

          echo "Runtime DB compatibility check passed."

      # ---------------------------------------------------------
      # 11. DEPLOY NEW RUNTIME TASK TO ECS
      #
      # Migration credentials are NOT present in this task.
      # ---------------------------------------------------------

      - name: Deploy new runtime task definition to ECS
        id: deploy-service
        run: |
          echo "Deploying runtime task:"
          echo "${{ steps.runtime-taskdef.outputs.arn }}"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.runtime-taskdef.outputs.arn }}" \
            --force-new-deployment

          echo "ECS service update started."

      # ---------------------------------------------------------
      # 12. WAIT FOR ECS ROLLING DEPLOYMENT
      # ---------------------------------------------------------

      - name: Wait for ECS service to become stable
        run: |
          echo "Waiting for rolling deployment..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "ECS service is stable."

      # ---------------------------------------------------------
      # 13. PRODUCTION HEALTH CHECK
      # ---------------------------------------------------------

      - name: Production API health check
        run: |
          echo "Checking api.goxlally.ai..."

          for i in {1..12}; do
            if curl --fail --silent --show-error \
              https://api.goxlally.ai/api/v1/health
            then
              echo
              echo "Production backend is healthy."
              exit 0
            fi

            echo "Health check attempt $i failed."
            echo "Retrying in 10 seconds..."

            sleep 10
          done

          echo "============================================"
          echo "PRODUCTION HEALTH CHECK FAILED"
          echo "============================================"

          exit 1

      # ---------------------------------------------------------
      # 14. AUTOMATIC ECS ROLLBACK
      #
      # Runs ONLY if:
      # - ECS service had already been changed
      # - a later deployment step failed
      #
      # This restores the exact previous runtime task definition.
      #
      # IMPORTANT:
      # Database migrations are NOT automatically reversed.
      # Migrations must therefore remain backward-compatible with
      # the previous runtime during the deployment/rollback window.
      # ---------------------------------------------------------

      - name: Roll back to previous production task
        if: failure() && steps.deploy-service.outcome == 'success'
        run: |
          PREVIOUS_TASK="${{ steps.previous-task.outputs.arn }}"

          echo "============================================"
          echo "DEPLOYMENT FAILED"
          echo "STARTING AUTOMATIC ECS ROLLBACK"
          echo "============================================"

          echo "Restoring:"
          echo "$PREVIOUS_TASK"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREVIOUS_TASK" \
            --force-new-deployment

          echo "Waiting for rollback deployment to stabilize..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "Previous ECS runtime task definition restored."

          echo "Checking production API after rollback..."

          for i in {1..12}; do
            if curl --fail --silent --show-error \
              https://api.goxlally.ai/api/v1/health
            then
              echo
              echo "============================================"
              echo "ROLLBACK SUCCESSFUL"
              echo "Production backend is healthy again."
              echo "============================================"
              exit 0
            fi

            echo "Rollback health check attempt $i failed."
            echo "Retrying in 10 seconds..."

            sleep 10
          done

          echo "============================================"
          echo "ROLLBACK COMPLETED BUT HEALTH CHECK FAILED"
          echo "MANUAL INVESTIGATION REQUIRED"
          echo "============================================"

          exit 1

      # ---------------------------------------------------------
      # 15. SUCCESS SUMMARY
      # ---------------------------------------------------------

      - name: Deployment summary
        if: success()
        run: |
          echo "============================================"
          echo "ALLY BACKEND DEPLOYMENT SUCCESSFUL"
          echo "============================================"

          echo "Commit:"
          echo "${{ steps.deploy-sha.outputs.sha }}"

          echo
          echo "Image:"
          echo "${{ steps.image.outputs.uri }}"

          echo
          echo "Previous runtime task:"
          echo "${{ steps.previous-task.outputs.arn }}"

          echo
          echo "New runtime task:"
          echo "${{ steps.runtime-taskdef.outputs.arn }}"

          echo
          echo "Migration-only task:"
          echo "${{ steps.migration-taskdef.outputs.arn }}"

          echo
          echo "Runtime DB credential:"
          echo "Preserved from production task definition (ally_app)."

          echo
          echo "Migration DB credential:"
          echo "Injected only into one-off migration task definition."

          echo
          echo "API:"
          echo "https://api.goxlally.ai"

          echo
          echo "Gotenberg and ECS sidecars:"
          echo "Preserved from current production task definition."

          echo "============================================"
