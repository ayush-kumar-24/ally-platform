name: Account-deletion sweep

# Drives app/api/v1/webhooks/router.py's /deletion-sweep endpoint on a schedule.
# This exists because the live Supabase project does not have pg_cron installed
# (confirmed: `list_extensions` shows pg_cron installed_version = null) and the
# backend runs as a persistent container with no in-process scheduler -- so
# "scheduled" has to be driven from somewhere external. GitHub Actions' cron is
# the simplest option that needs no new infrastructure.
#
# Required repo secret:
#   BACKEND_URL             e.g. https://<app>.awsapprunner.com
#   DELETION_SWEEP_SECRET   must equal the backend's SUPABASE_WEBHOOK_SECRET

on:
  schedule:
    # Once a day is enough for a 30-day grace window -- being a few hours late
    # to erase a founder is not a compliance incident the way being late to
    # schedule one for them would be.
    - cron: "17 3 * * *"
  workflow_dispatch: {}   # manual trigger, e.g. to drain a backlog after an outage

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deletion sweep
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${BACKEND_URL}/api/v1/webhooks/deletion-sweep" \
            -H "X-Webhook-Secret: ${DELETION_SWEEP_SECRET}")
          cat response.json
          if [ "$status" -ge 300 ]; then
            echo "Sweep endpoint returned HTTP $status"
            exit 1
          fi
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          DELETION_SWEEP_SECRET: ${{ secrets.DELETION_SWEEP_SECRET }}
