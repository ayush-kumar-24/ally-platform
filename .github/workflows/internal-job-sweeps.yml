# Calls the backend's internal job sweeps on a schedule.
#
# Nothing else calls them. Without this: a founder whose reasoning task died
# mid-pipeline (any deploy kills in-flight ones) is stranded with a COMPLETED
# session, no report, and their one lifetime diagnosis already spent -- and
# scheduled account erasures under DPDP never actually execute.
#
# Every endpoint here is idempotent and takes a shared secret, so running them
# more often than needed is safe and a missed run costs only latency.
#
# The two mail sweeps are the delivery half of features that had none: task
# reminders and bell notifications were both written to the database and never
# sent to anybody.
#
# THIS IS A BACKSTOP FOR TASK REMINDERS, NOT THE SCHEDULE. A founder picks
# their own reminder offset in Plan Your Day and the smallest is five minutes,
# which this cannot serve: the cron below says ten minutes and the runs
# actually land two to five hours apart (measured over 2026-09-10..12). The
# real schedule is EventBridge Scheduler at one-minute cadence -- see
# backend/docs/TASK-REMINDER-SCHEDULE.md. Running both is harmless: every row
# the sweep examines moves off "scheduled" whether it was sent or skipped.
#
# GitHub's scheduled runs are best-effort and can be delayed under load, and
# GitHub disables schedules after 60 days without repo activity. That is
# acceptable for the report sweeps; if process-deletions needs a hard guarantee
# for compliance, move that one to EventBridge Scheduler.

name: Internal job sweeps

on:
  schedule:
    # Report recovery + PDF backfill: every 10 minutes.
    - cron: "*/10 * * * *"
    # Account erasure: once a day, 00:50 IST (19:20 UTC). Deliberately NOT on
    # the ten-minute cron -- the sweep only ever acts on founders whose 30-day
    # window has already closed, so checking every ten minutes buys nothing and
    # puts a destructive job on a schedule nobody reads.
    - cron: "20 19 * * *"
  workflow_dispatch:      # so it can be run by hand while testing

concurrency:
  group: internal-job-sweeps
  cancel-in-progress: false

jobs:
  sweeps:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile missing reports
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -f -X POST \
            "$API/api/v1/internal/jobs/reconcile-reports" \
            -H "X-Internal-Secret: $SECRET"
        env:
          API: ${{ vars.ALLY_API_BASE || 'https://api.goxlally.ai' }}
          SECRET: ${{ secrets.INTERNAL_JOBS_SECRET }}

      - name: Backfill report PDFs
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -f -X POST \
            "$API/api/v1/internal/jobs/backfill-report-pdfs" \
            -H "X-Internal-Secret: $SECRET"
        env:
          API: ${{ vars.ALLY_API_BASE || 'https://api.goxlally.ai' }}
          SECRET: ${{ secrets.INTERNAL_JOBS_SECRET }}

      - name: Send due task reminders
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -f -X POST \
            "$API/api/v1/internal/jobs/send-task-reminders" \
            -H "X-Internal-Secret: $SECRET"
        env:
          API: ${{ vars.ALLY_API_BASE || 'https://api.goxlally.ai' }}
          SECRET: ${{ secrets.INTERNAL_JOBS_SECRET }}

      - name: Send notification emails
        if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -f -X POST \
            "$API/api/v1/internal/jobs/send-notification-emails" \
            -H "X-Internal-Secret: $SECRET"
        env:
          API: ${{ vars.ALLY_API_BASE || 'https://api.goxlally.ai' }}
          SECRET: ${{ secrets.INTERNAL_JOBS_SECRET }}

      # This step was gated on workflow_dispatch ALONE, while every other step
      # in this file also runs on the schedule. So it only ever ran when
      # somebody clicked the button: a founder whose 30-day window closed was
      # never actually erased unless a human happened to trigger this by hand.
      # EventBridge is now the real schedule (see backend/docs/
      # DELETION-SCHEDULE.md); this is the backstop, and a backstop that only
      # fires when asked is not one.
      - name: Process due account deletions
        if: github.event.schedule == '20 19 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sS -f -X POST \
            "$API/api/v1/internal/jobs/process-deletions" \
            -H "X-Internal-Secret: $SECRET"
        env:
          API: ${{ vars.ALLY_API_BASE || 'https://api.goxlally.ai' }}
          SECRET: ${{ secrets.INTERNAL_JOBS_SECRET }}